default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL") { "postgresql://conheca_user:conheca_pass@postgres:5432/conheca_test" } %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
