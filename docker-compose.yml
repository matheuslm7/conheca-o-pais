services:
  postgres:
    image: postgres:16-alpine
    container_name: conheca_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conheca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conheca_pass}
      POSTGRES_DB: ${POSTGRES_DB:-conheca_development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conheca_user} -d ${POSTGRES_DB:-conheca_development}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: conheca_backend
    working_dir: /app
    environment:
      RAILS_ENV: development
      BUNDLE_PATH: /usr/local/bundle
      DATABASE_URL: postgresql://${POSTGRES_USER:-conheca_user}:${POSTGRES_PASSWORD:-conheca_pass}@postgres:5432/${POSTGRES_DB:-conheca_development}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-conheca_user}:${POSTGRES_PASSWORD:-conheca_pass}@postgres:5432/conheca_test
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conheca_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  frontend_node_modules:
